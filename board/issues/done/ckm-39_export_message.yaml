  event: created
- at: '2026-08-11T11:30:00Z'
  by: claude
  details: 'Shipped in v2.5.0. export_message (read tier), format inferred from
    the destination extension (.md/.markdown/.txt = greppable record, .eml = raw
    MIME). MEASURED, both tenants, 10 real messages: a distinctive word from each
    message''s own preview was found in the .eml 7/10 and in the .md record 10/10,
    with the .md 4-7x smaller (1.8-40 KB vs 8.6-289 KB) — that ratio is the whole
    argument for the format. Graph does the HTML->text conversion via the Prefer
    header, so no HTML stripping code and no new dep. Front matter quotes
    defensively (a subject carrying quotes, colons or newlines cannot inject a
    second key — offline test). Record is byte-deterministic so re-export shows no
    git diff. Attachment bytes are never written; the manifest carries the ids for
    download_attachment. Shares _write_target/_write_atomic with CKM-32, so the
    root confinement, no-overwrite and no-residue rules are one implementation.
    VERIFIED: 7 new offline tests; live on BOTH tenants (round trip on a
    self-created draft asserts the body is plain text and the HTML is gone).'
  event: completed
- at: '2026-08-11T13:15:00Z'
  by: claude
  details: 'seanwy mid-session: make the record an Open Knowledge Format document
    (openknowledgeformat.com) so exports can live in an okf/ repo — offered as a
    flag, "can still keep yaml format within md file if easier". Fetched the OKF
    v0.1 spec: markdown + YAML front matter, required `type`, recommended
    title/description/resource/tags/timestamp, extension keys allowed. DECIDED
    OKF-by-default rather than a flag, because extension keys mean one format
    can be both an OKF document and a full mail record — a flag would buy two
    code paths and two things to test for nothing. OKF names win where they
    overlap (title=subject, timestamp=date, resource=webLink), so nothing is
    written twice; description is Graph''s own bodyPreview (falling back to the
    body — an OKF doc with an empty description is a poor citizen of its repo);
    tags are derived facets (email, inbound/outbound, attachments, bulk,
    auto-reply). Direction is OMITTED when Graph has no sender (an unsent draft)
    rather than guessed. VERIFIED: offline (incl. a hostile subject that tries
    to inject a second `type:` key) and live on both tenants, where a real
    Google Alert exported as tags ["email","inbound","bulk"] with a clean
    markdown body.'
  event: updated
