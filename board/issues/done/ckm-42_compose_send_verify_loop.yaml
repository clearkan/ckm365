- at: '2026-08-20T03:40:00Z'
  by: claude
  event: moved
  details: 'doing -> done. Built and released as v2.6.0 (VERSION, pyproject,
    __init__, CHANGELOG). FIVE tools, all thin wrappers over calls the package
    already made, no new Graph scope, no consent prompt, no tenant-wide
    operation: (1) write-tier revise_draft — draft bodies composed by ckm365
    are now FENCED with HTML comments (common.BODY_MARK/SIGNATURE_MARK,
    invisible in every mail client) and revise_draft replaces what is inside
    the body fence, so the quoted history and the signature survive any number
    of revisions; on an unfenced draft (Outlook-composed, or pre-2.6.0) it
    inserts at the top of <body> and fences that, and caller HTML carrying a
    marker is refused so the fence cannot be forged. (2) signature_html per
    profile in profiles.toml (max 8 KB), applied below the text by
    create_reply_draft/create_forward_draft/create_draft, signature=False to
    skip. (3) write-tier discard_draft, draft-only; Graph DELETE moves to
    Deleted Items, so it stays recoverable and move_message''s no-deletion
    stance is untouched. (4) write-tier remove_attachment, add_attachment''s
    inverse, drafts only, same never-a-silent-first-match selection as
    download_attachment (the fileAttachment-only rule moved to the download
    path, since removal needs no bytes). (5) READ-tier verify_message —
    recipients, attachments (always listed: Graph reports hasAttachments false
    when the only attachments are inline), quoted-thread survival, signature
    presence, the text you wrote as plain text capped at 4000 chars, and the
    non-ASCII characters in it with counts; `boundary` says whether that text
    was identified exactly (fence) or by falling back to markers. Plus the
    docs pass: docs/graph-direct.md now opens with "check there is not already
    a tool" and a table of hand-rolled calls that have one, export_message
    included. scripts/draft-cycle-smoke.py now walks the whole loop through
    the tools instead of a raw DELETE.

    DELIBERATELY NOT BUILT: a tool to switch a draft between reply and
    reply-all. Graph fixes recipients when it seeds the draft; anything that
    "switched" one would have to patch recipients onto an existing reply and
    would silently drop the ones Graph derived. discard_draft +
    create_reply_draft(reply_all=True) is the honest path, is now two tool
    calls instead of two raw Graph calls, and is documented on both tools.

    VERIFIED: 153 offline tests pass (134 before, 19 new in
    tests/test_mail_compose.py), ruff clean over src/tests/scripts. Two live
    tests were also added to tests/test_live.py (compose loop end to end with
    a residue check; draft-only guards against real Graph) — env-gated, and
    NOT RUN. NOT LIVE VERIFIED — AGENTS.md step 4 is outstanding: nothing in this session ran
    against a real mailbox (seanwy was driving and the session was told not to
    send or touch live mail). scripts/draft-cycle-smoke.py <profile> is the
    check to run, it sends nothing and leaves zero residue. Offline mocks have
    missed real Graph behaviour in this repo before, so treat the loop as
    unproven until it has run. Nothing committed or pushed — seanwy commits.'
