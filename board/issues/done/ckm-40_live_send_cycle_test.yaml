  details: 'Shipped in v2.5.0 as tests/test_live_send_cycle.py, double-gated
    (CKM365_LIVE_ACCOUNT + CKM365_LIVE_SEND=1), self-send only, zero residue.
    The test EARNED ITS KEEP IMMEDIATELY by finding three silent Graph
    subject-filter failures that nothing else in the suite would have caught,
    each looking exactly like "no such mail": (1) `subject eq ''<exact>''`
    returns ZERO rows even for a byte-identical subject — reproduced on a
    message the test had just sent and received, where startswith/contains
    both matched it in the same sequence; (2) `contains(subject,…)` returns
    ZERO rows once the folder is large — it worked on a small mailbox and
    never matched in a 93k-message inbox where startswith matched instantly;
    (3) even `startswith(subject,…)` LAGS DELIVERY — a reply delivered at
    23:22:09 stayed invisible to it for the remaining 5 minutes of the poll
    and was found by the same query 11 minutes later. (3) cost two ten-minute
    red herrings: the first diagnosis was "this tenant delivers slowly", and
    the poll window was raised to 600s before the evidence (delivery
    timestamps inside the polling window) showed the mail had been there all
    along. The poller now lists newest-first with NO filter and matches
    client-side; the same cycle that failed after 10 minutes passes in 21s.
    All three are in AGENTS.md gotchas, list_messages'' docstring and
    docs/graph-direct.md, with the rule stated as: never poll for
    just-arrived mail with a subject filter — list unfiltered or use delta.
    VERIFIED: green on both tenants (~20s each); residue re-checked by folder
    scan on both afterwards, nothing left behind.'
