description: "This board is clearkan-lite: YAML issues, directory as\ncolumn, `ckm-NN_slug.yaml`.\
  \ The Open Issue Format was extracted from exactly\nthat shape and published at\
  \ https://oif.md, so the migration is small and the\nformat is now specified and\
  \ validated rather than implied by a tool.\n\nWhat changes:\n\n- One Markdown\
  \ file per issue with YAML frontmatter, named `<slug>-<id>.md`\n  where the id\
  \ is six random Crockford base32 characters. `CKM-49` survives in\n  `aliases`,\
  \ so every existing reference in the code, docs and commit messages\n  keeps resolving.\n\
  - The `status` and `column` fields are deleted. The directory already carries\n\
  \  the state and holding it twice lets them disagree.\n- The inline `history`\
  \ list becomes one comment file per entry under\n  `comments/<issue-id>/`. The\
  \ mapping is exact: an entry's `at`, `by` and text\n  are a comment's three required\
  \ keys, and `event` rides along as an extra key\n  because consumers preserve\
  \ keys they do not recognise.\n- `description` becomes the body, so an issue reads\
  \ as a document.\n- Everything else, including tags, priority and parent, carries\
  \ across\n  unchanged.\n\nWhy it is worth doing here specifically: the correspondence\
  \ work in CKM-49\npoints a board at an evidence corpus using `about` entries carrying\n\
  `mid:` resources. That mechanism is defined by OIF and has no equivalent in\n\
  clearkan-lite, so this board cannot cite the messages it exports until it\nmoves.\n\
  \n`pip install oifmd` then `oifmd validate board` checks the result against the\n\
  specification. Section 7.3 of the spec covers the migration and gives the\nmapping\
  \ table; the agent skill at https://oif.md/skill.md is enough for an\nagent to\
  \ do the conversion without further instruction.\n\nDerive each new id deterministically\
  \ from the existing key if the migration\nmight be run more than once, or a second\
  \ run produces a second set of files.\n\nNot urgent. The board works. This is\
  \ about being able to link to\ncorrespondence, and about dogfooding a format we\
  \ publish."
