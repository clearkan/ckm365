id: CKM-46
title: New-box setup has silent failure modes; doctor cannot see the MCP registration
column: backlog
status: backlog
created_at: '2026-08-30T02:49:19Z'
updated_at: '2026-08-30T04:55:16Z'
assignees: []
description: |-
  Filed from a real new-box provisioning run (Fedora 44, 2026-08-30):
  clone -> uv sync -> profiles -> certs -> MCP registration -> device-code
  login -> verify. It worked, but several documented steps fail SILENTLY
  when followed exactly.

  Items 1, 2, 4 and 5 are FIXED (docs commit, 2026-08-30). Item 3 — the
  systemic one — remains, and is the whole reason this ticket stays open.

  --- OPEN ---

  3. `doctor` cannot see the gap in item 2.
     `_doctor` (admin.py:343) validates the profiles file, token caches,
     login identity, consent tier and app-only credential material — all
     from the CLI's own environment. It never inspects the Claude Code MCP
     registration, which is the environment that actually matters for the
     server. That is precisely what makes item 2 silent: doctor passes in
     your terminal while the same profile has no credential inside
     `ckm365 serve`. Docs now warn about it; nothing detects it.
     FIX: `ckm365 doctor --mcp` — locate the `ckm365` entry in
     `~/.claude.json`, and for every `client_credential` profile assert the
     entry's `env` block carries that profile's cert/secret vars. Warn, do
     not fail, when no registration exists — programmatic and pydantic-ai
     consumers are legitimate and have no MCP entry at all.
     Note the check can only ever be heuristic: the server also inherits
     whatever environment Claude Code was launched with, which doctor
     cannot observe from outside. So report it as "not declared on the
     registration" (actionable, always true) rather than "missing"
     (guessable, sometimes wrong).

  --- FIXED 2026-08-30 ---

  1. `.env.example` implied a dotenv loader that does not exist.
     `config.py` calls `os.environ.get` directly and there is no dotenv
     dependency in `pyproject.toml` or `uv.lock`, yet the repo shipped
     `.env.example` and `.gitignore` carefully un-ignored it. An operator
     who copied it to `.env` and filled it in got no error and no
     credential.
     FIXED: renamed to `env.example.sh` with `export` lines and a header
     stating it must be SOURCED, where to put it (600, outside the repo),
     and that the MCP server needs the same vars passed separately.
     `.gitignore` updated.

  2. The documented `claude mcp add` line dropped app-only credentials.
     README and docs/onboarding.md both registered the server with no
     `-e`. The `ckm365 serve` child only inherits what Claude Code itself
     was launched with, so an export in `.bashrc` reaches it only when
     Claude Code was started from a shell that sourced that rc — under a
     desktop launcher, IDE or service manager it silently does not.
     FIXED: README "Setup" and docs/app-only-setup.md §2 now show the `-e`
     form and explain why, noting only a path and a thumbprint land in
     `.claude.json`, never key material.

  4. The setup checklist never exercised the write path.
     ORIGINALLY FILED AS "no read+write smoke test exists" — that was
     WRONG, and the correction matters more than the finding.
     `scripts/draft-cycle-smoke.py` has existed since 2026-08-19 (CKM-42)
     and is more thorough than what was proposed to replace it:
     createReply -> verify -> attach -> revise -> remove attachment ->
     discard, zero residue, never sends. It is listed in AGENTS.md's
     working loop. The real defect was narrower: neither README "Setup"
     nor onboarding.md's verify step mentioned it, so a new-box operator
     following the docs verified only the read path and never learned the
     write smoke existed.
     FIXED: README "Setup" now runs `doctor`, `live-smoke.py` (labelled
     READ) and `draft-cycle-smoke.py` (labelled WRITE).
     LESSON: the filer read `live-smoke.py`, never listed `scripts/`, and
     wrote a duplicate. Check what exists before proposing tooling.

  5. README Setup's first command failed on a clean box.
     `cp profiles.example.toml ~/.config/ckm365/profiles.toml` preceded any
     mkdir, and `~/.config/ckm365/` does not exist on a fresh machine.
     onboarding.md had no mkdir either.
     FIXED: both now `mkdir -p -m 700 ~/.config/ckm365` first. The 700
     matters — `state_dir()` enforces 0700 on the state dir, but nothing
     enforced it on the config dir that holds `certs/`.
