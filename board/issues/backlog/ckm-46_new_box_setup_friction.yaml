id: CKM-46
title: New-box setup has three silent failure modes and no write-path verification
column: backlog
status: backlog
created_at: '2026-08-30T02:49:19Z'
updated_at: '2026-08-30T02:49:19Z'
assignees: []
description: |-
  Filed from a real new-box provisioning run (Fedora 44,
  2026-08-30): clone → uv sync → profiles → certs → MCP registration →
  device-code login → verify. It worked, but three of the steps fail
  SILENTLY when done exactly as the docs say, and there is no sanctioned
  way to answer "can this box actually write mail?".

  Each item below was verified against the source in this repo, not
  assumed.

  1. `.env.example` implies a dotenv loader that does not exist.
     The repo ships `.env.example` documenting `CKM365_*` vars, and
     `.gitignore` carefully ignores `.env`/`.env.*`. But nothing reads a
     `.env` file: `config.py` calls `os.environ.get` directly, and there
     is no dotenv dependency in `pyproject.toml` or `uv.lock`. An
     operator who copies `.env.example` to `.env` and fills it in gets no
     error and no credential — the app-only profile just keeps reporting
     "set CKM365_<P>_CLIENT_SECRET or ...".
     FIX: either load a real env file (repo `.env`, or a
     `CKM365_ENV_FILE` pointing anywhere), or rename it to
     `env.example.sh` with `export` lines and say in README Setup that it
     must be sourced. Prefer the rename — it keeps the two-dep rule.

  2. The documented `claude mcp add` line drops app-only credentials.
     README:168 and docs/onboarding.md:59 both register the server as
     `claude mcp add --scope user ckm365 -- uv run ...` with no `-e`.
     Claude Code does not source the operator's shell rc, so the
     `ckm365 serve` child never sees `CKM365_<PROFILE>_CLIENT_CERT_PATH`
     / `_THUMBPRINT` even when exported in `.bashrc` and the
     CLI works fine. Net effect: `uv run ckm365 doctor` says all good,
     the same profile is broken under MCP, and nothing says why.
     FIX: show the `-e` form in both docs, e.g.
       claude mcp add --scope user ckm365 \
         -e CKM365_<P>_CLIENT_CERT_PATH=$HOME/.config/ckm365/certs/<p>.key.pem \
         -e CKM365_<P>_CLIENT_CERT_THUMBPRINT=<sha1> \
         -- uv run --directory /path/to/ckm365 ckm365 serve ...
     Only a path and a thumbprint land in `.claude.json` — no key
     material — so this is safe to document as the default.

  3. `doctor` cannot see the gap in (2).
     `_doctor` (admin.py:343) validates the profiles file, token caches,
     login identity, consent tier and app-only credential material — all
     from the CLI's own environment. It never inspects the Claude Code
     MCP registration, which is the environment that actually matters
     for the server. That is exactly why (2) is silent.
     FIX: `ckm365 doctor --mcp` — locate the `ckm365` entry in
     `~/.claude.json`, and for every `client_credential` profile assert
     the entry's `env` block carries that profile's cert/secret vars.
     Warn, do not fail, when no registration exists (programmatic and
     pydantic-ai consumers are legitimate).

  4. No read+WRITE smoke test.
     `scripts/live-smoke.py` is read-only by construction
     (`Ctx.create(write=False, ...)`), and onboarding.md:52 offers it as
     THE verification step. So the documented new-box checklist never
     exercises the write tier, and "this box can send mail on my behalf"
     stays unverified until the first real draft.
     FIX: add `scripts/rw-smoke.py <profile>` — create_draft to self →
     read it back from Drafts → discard_draft. Never sends (create_draft
     cannot), and the discard is recoverable from Deleted Items. Keep
     live-smoke's privacy contract: counts and truncated ids only, so
     the output is safe to paste into an agent session. A working
     implementation was written during this run and is available; it
     passed on both device-code profiles of a two-tenant setup.

  5. README Setup's first command fails on a clean box.
     README:159 is `cp profiles.example.toml ~/.config/ckm365/profiles.toml`
     but `~/.config/ckm365/` does not exist yet on a fresh machine, so
     the cp errors. onboarding.md has no mkdir either.
     FIX: `mkdir -p -m 700 ~/.config/ckm365` first. The 700 matters —
     `state_dir()` enforces 0700 on the state dir but nothing enforces
     it on the config dir that holds `certs/`.

  Items 1, 2 and 5 are doc/UX bugs with one-line fixes. Item 3 is the
  systemic one — it is what turns 2 from "annoying" into "silent". Item 4
  is a genuine coverage gap.

  SUGGESTED SEQUENCE: 5 and 1 (trivial), then 4 (script exists), then 2
  (docs) together with 3 (the check that keeps 2 fixed).
