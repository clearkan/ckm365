[project]
name = "ckm365"
version = "2.5.0"
description = "Minimal multi-tenant Microsoft Graph MCP server (mail + calendar)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sean Whiteley" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "msal>=1.31",
]

# mcp is needed ONLY by the `ckm365 serve` MCP front door; programmatic
# and pydantic-ai consumers stay mcp-free (and unpinned from its majors).
[project.optional-dependencies]
mcp = ["mcp>=2.0"]

[project.scripts]
ckm365 = "ckm365.server:main"

[dependency-groups]
# dev mirrors the mcp extra so a plain `uv sync` keeps `uv run ckm365
# serve` working from a source checkout (live MCP registrations use it).
dev = ["pytest>=8", "mcp>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ckm365"]
