[project]
name = "ckm365"
version = "1.5.0"
description = "Minimal multi-tenant Microsoft Graph MCP server (mail + calendar)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sean Whiteley" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.0",
    "msal>=1.31",
]

[project.scripts]
ckm365 = "ckm365.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ckm365"]
